[build]
  command = "npm run build"
  publish = "dist"

# --- Cache del navegador (Fase 6) ---
# Estilos, scripts y fuentes de Astro llevan huella en el nombre: se pueden guardar un ano.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# Imagenes: 30 dias.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# --- Redirecciones de WordPress (que no se pierda nada de lo indexado) ---
# Las miniaturas (foto-1024x1024.jpg, ...) van en public/_redirects, que Netlify
# lee antes que este fichero (scripts/redirecciones-wp.mjs).

# Imagenes viejas: /wp-content/uploads/... -> /img/...
[[redirects]]
  from = "/wp-content/uploads/*"
  to = "/img/:splat"
  status = 301
  force = true

# Sitemaps de Yoast -> nuestro sitemap
[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301
# Netlify no admite «*» en mitad del nombre: los mapas de Yoast de la web antigua, uno a uno.
[[redirects]]
  from = "/page-sitemap.xml"
  to = "/sitemap.xml"
  status = 301
[[redirects]]
  from = "/post-sitemap.xml"
  to = "/sitemap.xml"
  status = 301

# Feed de WordPress
[[redirects]]
  from = "/feed"
  to = "/"
  status = 301
[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301

# Restos de WordPress sin pagina nueva
[[redirects]]
  from = "/wp-content/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-includes/*"
  to = "/"
  status = 301

# Páginas de excavaciones por ciudad: primero se publicaron como /excavaciones/<ciudad>/
# y Yama pidió /excavaciones-<ciudad>/ (2026-11-03).
[[redirects]]
  from = "/excavaciones/valencia/"
  to = "/excavaciones-valencia/"
  status = 301
[[redirects]]
  from = "/excavaciones/betera/"
  to = "/excavaciones-betera/"
  status = 301
[[redirects]]
  from = "/excavaciones/sagunto/"
  to = "/excavaciones-sagunto/"
  status = 301
[[redirects]]
  from = "/excavaciones/xativa/"
  to = "/excavaciones-xativa/"
  status = 301
[[redirects]]
  from = "/excavaciones/algemesi/"
  to = "/excavaciones-algemesi/"
  status = 301
[[redirects]]
  from = "/excavaciones/cullera/"
  to = "/excavaciones-cullera/"
  status = 301
[[redirects]]
  from = "/excavaciones/madrid/"
  to = "/excavaciones-madrid/"
  status = 301

# www -> sin www
[[redirects]]
  from = "https://www.contenedoresescombros.com/*"
  to = "https://contenedoresescombros.com/:splat"
  status = 301
  force = true

# PENDIENTE AL LANZAR (Fase 7): redirigir el subdominio de Netlify (xxx.netlify.app)
# al dominio, cuando se sepa el nombre que asigna Netlify.
